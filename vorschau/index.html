  html, body { height: 100%; }

    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px;
  }
  #frame { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  #stagebox { position: relative; overflow: hidden; border-radius: 18px; background: #000; box-shadow: 0 0 0 1px var(--line); }
  #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; overflow: hidden; }
  #gl { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; display: block; }

  const rArm = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.6, 6), armor); rArm.position.set(0.08, -0.3, 0.05); rArm.rotation.z = 0.25; sauArm.add(rArm);
  const rHand = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 6), darker); rHand.position.set(0.16, -0.62, 0.1); sauArm.add(rHand);
  const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.1, 6), std(0x3b2a1e)); handle.position.set(0.22, -0.2, 0.12); handle.rotation.z = -0.15; sauArm.add(handle);
  const head = new THREE.Mesh(new THREE.IcosahedronGeometry(0.18, 0), std(0x3a3d48, { metalness: 0.5, roughness: 0.4 })); head.position.set(0.3, 0.36, 0.12); sauArm.add(head);
  for (let i = 0; i < 6; i++) { const d = new THREE.Vector3().setFromSphericalCoords(1, Math.acos(1 - 2 * (i + 0.5) / 6), i * 2.4); const sp = new THREE.Mesh(new THREE.ConeGeometry(0.04, 0.16, 4), darker); sp.position.copy(head.position).addScaledVector(d, 0.2); sp.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d); sauArm.add(sp); }
  sauArm.position.set(0.55, 1.25, 0); sau.add(sauArm);
  // helmet
  const helm = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.44, 0.55, 10), darker); helm.position.y = 1.72; sau.add(helm);
  const dome = new THREE.Mesh(new THREE.SphereGeometry(0.42, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2), darker); dome.position.y = 2.0; sau.add(dome);
  [-0.32, -0.16, 0, 0.16, 0.32].forEach((x, i) => { const h = [0.55, 0.75, 0.95, 0.75, 0.55][i]; const sp = new THREE.Mesh(new THREE.ConeGeometry(0.07, h, 5), darker); sp.position.set(x, 2.15 + h / 2, -0.05); sp.rotation.z = -x * 0.8; sau.add(sp); });
  const visor = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.32, 0.1), new THREE.MeshBasicMaterial({ color: 0x050507 })); visor.position.set(0, 1.74, 0.41); sau.add(visor);
  [-1, 1].forEach(sx => {
    const e = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.05, 0.03), glow(0xff8a1a)); e.position.set(sx * 0.11, 1.78, 0.47); e.rotation.z = sx * 0.35; eyesAngry.add(e);
    const s = new THREE.Mesh(new THREE.CircleGeometry(0.06, 14), glow(0xffb04a)); s.position.set(sx * 0.11, 1.76, 0.47); eyesShock.add(s);
  });
  sau.add(eyesAngry); sau.add(eyesShock); eyesShock.visible = false;
  const shadow = new THREE.Mesh(new THREE.CircleGeometry(0.7, 20), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.45 }));
  shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.04; scene.add(shadow);
  scene.add(sau);
}
// Embers
const EMB = 140;
const embBase = new Float32Array(EMB * 4);
for (let i = 0; i < EMB; i++) embBase.set([(R() - 0.5) * 30, R() * 12, (R() - 0.5) * 24 - 4, 0.4 + R() * 0.8], i * 4);
const embGeo = new THREE.BufferGeometry();
embGeo.setAttribute("position", new THREE.Float32BufferAttribute(new Float32Array(EMB * 3), 3));
scene.add(new THREE.Points(embGeo, new THREE.PointsMaterial({ color: 0xffb347, size: 0.09, fog: false })));

// ---------- camera path: [time, position, target] ----------
const K = [
  [0.0, [0, 6.5, 15], [0, 3.2, -4]],
  [3.0, [0.6, 3.0, 8], [1, 2.4, -2]],
  [3.5, [0, 1.9, 6.0], [0, 1.55, 0]],
  [6.0, [0, 1.85, 5.5], [0, 1.5, 0]],
  [6.5, [0.9, 1.85, 6.4], [0.8, 1.45, 0]],
  [9.0, [0.9, 1.85, 6.2], [0.8, 1.45, 0]],
  [9.7, [0, 5.0, 13], [0, 2.4, -2]],
  [12.8, [0, 4.8, 12.4], [0, 2.4, -2]],
  [13.3, [0, 2.0, 6.0], [0, 1.9, 0]],
  [15.3, [0, 2.0, 5.6], [0, 1.9, 0]],
  [15.8, [0, 1.9, 5.8], [0, 1.55, 0]],
  [18.0, [0, 1.85, 5.5], [0, 1.55, 0]],
  [18.8, [-2.2, 3.0, 9], [-2, 2.6, -5]],
  [21.1, [-2.0, 3.0, 8.6], [-2, 2.6, -5]],
  [21.7, [0, 4.2, 10], [0, 1.0, 0]],
  [25.4, [0, 4.0, 9.6], [0, 1.0, 0]],
  [25.9, [0, 1.9, 5.8], [0, 1.55, 0]],
  [29.3, [0, 1.85, 5.5], [0, 1.55, 0]],
  [29.8, [-3, 2.2, 5.2], [-3, 1.0, 0]],
  [30.9, [-3, 2.2, 5.0], [-3, 1.0, 0]],
  [31.4, [0, 2.2, 6.5], [0, 0.8, 1.5]],
  [33.0, [0, 2.2, 6.3], [0, 0.8, 1.5]],
  [33.8, [0, 6.5, 15], [0, 3.2, -4]],
  [36.05, [0, 6.8, 15.6], [0, 3.2, -4]]
].map(([t, p, q]) => [t, new THREE.Vector3(...p), new THREE.Vector3(...q)]);
const _p = new THREE.Vector3(), _q = new THREE.Vector3();
function cameraAt(t) {
  let i = 0;
  while (i < K.length - 2 && t > K[i + 1][0]) i++;
  const [ta, pa, qa] = K[i], [tb, pb, qb] = K[i + 1];
  const u = ease(ramp(t, ta, tb));
  _p.lerpVectors(pa, pb, u); _q.lerpVectors(qa, qb, u);
  camera.position.copy(_p); camera.lookAt(_q);
}

// ---------- colours for dusk / night ----------
const C = (h) => new THREE.Color(h);
const DAY = { top: C(0x2a0f2e), bottom: C(0xf07a2a), fog: C(0x7a2a1a), hemi: C(0xffb070), sun: C(0xff9a50), sunI: 2.2, hemiI: 1.4 };
const NIGHT = { top: C(0x05041a), bottom: C(0x2a1640), fog: C(0x120a24), hemi: C(0x5a6aa0), sun: C(0x7080c0), sunI: 0.7, hemiI: 0.6 };
const nightAt = t => clamp(ramp(t, 18.3, 19.0) - ramp(t, 21.2, 21.8) + ramp(t, 33.0, 33.6), 0, 1);

// ---------- the one function that draws time t ----------
function renderAt(t) {
  cameraAt(t);
  const n = nightAt(t);
  skyMat.uniforms.top.value.copy(DAY.top).lerp(NIGHT.top, n);
  skyMat.uniforms.bottom.value.copy(DAY.bottom).lerp(NIGHT.bottom, n);
  scene.fog.color.copy(DAY.fog).lerp(NIGHT.fog, n);
  hemi.color.copy(DAY.hemi).lerp(NIGHT.hemi, n); hemi.intensity = DAY.hemiI + (NIGHT.hemiI - DAY.hemiI) * n;
  sun.color.copy(DAY.sun).lerp(NIGHT.sun, n); sun.intensity = DAY.sunI + (NIGHT.sunI - DAY.sunI) * n;
  fill.intensity = 14 - 6 * n;

  const pulse = 1 + 0.07 * Math.sin(t * 3.9);
  eye.scale.setScalar(pulse); eyeLight.intensity = (40 + 30 * n) * pulse;
  flames.forEach((f, i) => { const s = 1 + 0.25 * Math.sin(t * 17 + i * 2.1) + 0.1 * Math.sin(t * 29 + i); f.scale.set(1, s, 1); f.userData.light.intensity = 5 + 2 * s; });

  // Sauron: idle bob, hops on key words, mace up on "Ork-Armee", shock at the attack
  const hop = bump(t, 4.3, 0.3, 0.28) + bump(t, 8.0, 0.25, 0.2) + bump(t, 11.95, 0.25, 0.22) + bump(t, 19.65, 0.3, 0.35);
  sau.position.y = 0.02 * Math.sin(t * 6) + hop;
  const lift = ramp(t, 4.3, 4.5) - ramp(t, 5.6, 5.9);
  sauArm.rotation.z = 1.2 * ease(clamp(lift, 0, 1));
  const shocked = (t >= 19.65 && t < 21.2) || t >= 34.0;
  eyesShock.visible = shocked; eyesAngry.visible = !shocked;

  const ep = embGeo.attributes.position;
  for (let i = 0; i < EMB; i++) {
    const b = i * 4, y = (embBase[b + 1] + t * embBase[b + 3]) % 12;
    ep.setXYZ(i, embBase[b] + Math.sin(t * 0.8 + i) * 0.3, y, embBase[b + 2]);
  }
  ep.needsUpdate = true;
  renderer.render(scene, camera);
}

const capsEl = document.getElementById("caps");
CAPS.forEach((c, i) => {

  });

});
tl.set({}, {}, DUR);

// ---------- layout: scale the 1080x1920 stage to the screen ----------
const frame = document.getElementById("frame"), stagebox = document.getElementById("stagebox"), stage = document.getElementById("stage");
let t = 0;
function fit() {
  const r = frame.getBoundingClientRect();
  const s = Math.max(0.05, Math.min(r.width / 1080, r.height / 1920));
  stagebox.style.width = 1080 * s + "px"; stagebox.style.height = 1920 * s + "px";
  stage.style.transform = "scale(" + s + ")";
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(1);
  renderer.setSize(Math.round(1080 * s * dpr), Math.round(1920 * s * dpr), false);
  renderAt(t);
}
new ResizeObserver(fit).observe(frame);

// ---------- player ----------
const audio = document.getElementById("audio"), btn = document.getElementById("play"), scrub = document.getElementById("scrub"), timeEl = document.getElementById("time"), note = document.getElementById("note");
const icoPlay = document.getElementById("icoPlay"), icoPause = document.getElementById("icoPause");
let playing = false, useAudio = true, startT = 0, t0 = 0;
const fmt = x => Math.floor(x / 60) + ":" + (x % 60).toFixed(1).padStart(4, "0");
audio.addEventListener("error", () => { useAudio = false; note.textContent = "Ton nicht verfügbar: Die Vorschau läuft stumm."; });

function setT(x) {
  t = clamp(x, 0, DUR);
  renderAt(t);
  tl.seek(t, false);
  scrub.value = t;
  timeEl.textContent = fmt(t) + " / 0:36";
}
function setIcons() { icoPlay.hidden = playing; icoPause.hidden = !playing; btn.setAttribute("aria-label", playing ? "Pause" : "Abspielen"); }
async function play() {
  if (t >= DUR - 0.05) setT(0);
  playing = true; setIcons();
  startT = t; t0 = performance.now();
  if (useAudio) {
    try { audio.currentTime = t; await audio.play(); }
    catch (e) { useAudio = false; note.textContent = "Ton konnte nicht starten: Die Vorschau läuft stumm."; }
  }
  startT = t; t0 = performance.now();
  requestAnimationFrame(loop);
}
function pause() { playing = false; audio.pause(); setIcons(); }
function loop(now) {
  if (!playing) return;
  const x = (useAudio && !audio.paused) ? audio.currentTime : startT + (now - t0) / 1000;
  if (x >= DUR) { setT(DUR); pause(); return; }
  setT(x);
  requestAnimationFrame(loop);
}
btn.addEventListener("click", () => playing ? pause() : play());
scrub.addEventListener("input", () => {
  const x = parseFloat(scrub.value);
  if (useAudio) { try { audio.currentTime = x; } catch (e) {} }
  startT = x; t0 = performance.now();
  setT(x);
});
audio.addEventListener("ended", () => { if (playing) { setT(DUR); pause(); } });
document.addEventListener("keydown", e => { if (e.code === "Space" && e.target === document.body) { e.preventDefault(); playing ? pause() : play(); } });

fit();
setT(0);
window.__sceneReady = true;
window.__preview = { renderAt, tl, setT };
