<style>
  /* Layout: one 9:16 stage scaled to fit, voice picker + player underneath. Single dark look on purpose. */
  :root {
    --bg: #100a09;
    --panel: #1e1513;
    --line: #3a2a26;
    --fg: #f4ebe6;
    --muted: #a8958d;
    --ember: #ff8a2a;
    --gold: #ffc23a;
    --ink: #140f0f;
    --danger: #ff3b3b;
    --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
    --font-rune: "Cinzel Decorative", "Cinzel", "Trajan Pro", Georgia, serif;
    --font-engrave: "Cinzel", "Trajan Pro", Georgia, serif;
    --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui);
    display: flex; flex-direction: column; align-items: center; gap: 8px; box-sizing: border-box; overflow: hidden;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px;
  }
  #frame { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  #stagebox { position: relative; overflow: hidden; border-radius: 18px; background: #000; box-shadow: 0 0 0 1px var(--line); }
  #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; overflow: hidden; }
  #shake { position: absolute; inset: 0; }
  #gl { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; display: block; }
  #fail { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 120px; font: 700 52px/1.3 var(--font-ui); color: var(--fg); background: #1a0f0d; }

  .ov { position: absolute; left: 0; width: 1080px; display: flex; flex-direction: column; align-items: center; pointer-events: none; }
  .outline { text-shadow: 5px 5px 0 var(--ink), -5px 5px 0 var(--ink), 5px -5px 0 var(--ink), -5px -5px 0 var(--ink), 0 7px 0 var(--ink), 0 -7px 0 var(--ink), 7px 0 0 var(--ink), -7px 0 0 var(--ink), 0 14px 0 rgba(0,0,0,.45); }

  /* Sign: forged iron plaque on chains, molten title */
  #sign { top: 120px; }
  #signwrap { position: relative; width: 760px; padding-top: 150px; filter: drop-shadow(0 0 46px rgba(255, 90, 0, .55)) drop-shadow(0 18px 0 rgba(0,0,0,.55)); }
  .chain { position: absolute; top: 0; width: 26px; height: 170px;
    background: repeating-linear-gradient(180deg, transparent 0 4px, #3a3840 4px 10px, #8a8794 10px 13px, #3a3840 13px 22px, transparent 22px 26px);
    -webkit-mask: radial-gradient(ellipse 9px 12px at 50% 50%, transparent 55%, #000 58%) 0 0 / 26px 26px repeat-y;
            mask: radial-gradient(ellipse 9px 12px at 50% 50%, transparent 55%, #000 58%) 0 0 / 26px 26px repeat-y; }
  #chainL { left: 130px; } #chainR { right: 130px; }
  #signboard { position: relative; padding: 46px 40px 40px; text-align: center;
    background:
      radial-gradient(ellipse 60% 40% at 50% 115%, rgba(255,90,0,.35), transparent 70%),
      repeating-linear-gradient(100deg, rgba(255,255,255,.025) 0 2px, transparent 2px 9px),
      linear-gradient(180deg, #3a3740 0%, #1d1b21 45%, #121014 100%);
    clip-path: polygon(7% 0, 93% 0, 100% 16%, 100% 84%, 93% 100%, 7% 100%, 0 84%, 0 16%); }
  #signedge { position: absolute; inset: 14px; pointer-events: none; border: 3px solid rgba(201, 150, 70, .55);
    clip-path: polygon(6% 0, 94% 0, 100% 15%, 100% 85%, 94% 100%, 6% 100%, 0 85%, 0 15%); }
  .rivet { position: absolute; width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #b9b3c4, #4a4652 55%, #18161b 100%); box-shadow: 0 2px 2px rgba(0,0,0,.6); }
  #signtitle { font: 900 168px/1 var(--font-rune); letter-spacing: .02em;
    background: linear-gradient(180deg, #fff6d0 0%, #ffcf5a 28%, #ff7a12 60%, #b52800 88%, #5a0e00 100%);

    filter: drop-shadow(0 0 14px rgba(255, 120, 20, .85)) drop-shadow(0 5px 0 #0a0708); }
  #signsub { display: flex; align-items: center; justify-content: center; gap: 22px; margin-top: 14px; font: 900 54px/1 var(--font-engrave); letter-spacing: .28em; color: #d8cfc2; text-shadow: 0 3px 0 #000, 0 0 12px rgba(255,120,30,.35); padding-left: .28em; }
  #signsub::before, #signsub::after { content: ""; width: 70px; height: 4px; background: linear-gradient(90deg, transparent, #c99646); }
  #signsub::after { transform: scaleX(-1); }
  #signglow { position: absolute; left: 10%; right: 10%; bottom: 0; height: 6px; background: #ff6a00; filter: blur(6px); opacity: .9; }

  #hud { top: 186px; flex-direction: row; justify-content: center; gap: 16px; visibility: hidden; }
  .pill { position: relative; display: inline-flex; align-items: center; gap: 8px; padding: 6px 18px 6px 12px; border-radius: 36px; background: #fff; color: var(--ink); border: 5px solid var(--ink); font: 40px var(--font-display); box-shadow: 0 5px 0 rgba(0,0,0,.35); }
  .pill svg { width: 40px; height: 40px; }
  #weaponred { position: absolute; inset: -5px; border-radius: 36px; background: #e3262b; border: 5px solid var(--ink); color: #fff; display: flex; align-items: center; justify-content: center; gap: 8px; opacity: 0; }

  .cap { position: absolute; left: 60px; right: 60px; top: 1420px; text-align: center; visibility: hidden; opacity: 0; }
  .cap > div { display: inline-block; font: 92px/1.05 var(--font-display); color: #fff; }
  .cap .g { color: var(--gold); } .cap .r { color: var(--danger); }

  #voices { width: min(100%, 560px); display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  #voices::-webkit-scrollbar { display: none; }
  .vbtn { flex: 1 0 auto; border: 0; border-radius: 10px; padding: 7px 10px; background: var(--panel); color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); font: 700 12px var(--font-ui); cursor: pointer; text-align: left; line-height: 1.25; }
  .vbtn small { display: block; font-weight: 500; font-size: 10.5px; opacity: .8; }
  .vbtn[aria-pressed="true"] { background: var(--ember); color: var(--ink); box-shadow: none; }
  .vbtn:focus-visible, #play:focus-visible, #scrub:focus-visible { outline: 3px solid #ffd27a; outline-offset: 2px; }
  #player { width: min(100%, 560px); display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 14px; background: var(--panel); box-shadow: 0 0 0 1px var(--line); box-sizing: border-box; }
  #play { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--ember); color: var(--ink); cursor: pointer; display: grid; place-items: center; }
  #play svg { width: 20px; height: 20px; }
  #play svg[hidden] { display: none; }
  #scrub { flex: 1; min-width: 0; accent-color: var(--ember); }
  #time { flex: none; font: 600 13px var(--font-ui); font-variant-numeric: tabular-nums; color: var(--muted); min-width: 84px; text-align: right; }
  #note { font-size: 12px; color: var(--muted); min-height: 1em; text-align: center; }
</style>

}
const C = h => new THREE.Color(h);
const DAY = { top: C(0x2a0f2e), bottom: C(0xf07a2a), fog: C(0x7a2a1a), hemi: C(0xffb070), sun: C(0xff9a50), sunI: 2.2, hemiI: 1.4 };
const NIGHT = { top: C(0x05041a), bottom: C(0x2a1640), fog: C(0x120a24), hemi: C(0x5a6aa0), sun: C(0x7080c0), sunI: 0.7, hemiI: 0.6 };
const nightAt = m => clamp(ramp(m, 18.3, 19.0) - ramp(m, 21.2, 21.8) + ramp(m, 33.0, 33.6), 0, 1);

// ---------- the one function that draws voice time t ----------
function renderAt(t) {
  const m = unwarp(t);   // master clock
  cameraAt(m);
  const n = nightAt(m);
  skyMat.uniforms.top.value.copy(DAY.top).lerp(NIGHT.top, n);
  skyMat.uniforms.bottom.value.copy(DAY.bottom).lerp(NIGHT.bottom, n);
  scene.fog.color.copy(DAY.fog).lerp(NIGHT.fog, n);
  hemi.color.copy(DAY.hemi).lerp(NIGHT.hemi, n); hemi.intensity = DAY.hemiI + (NIGHT.hemiI - DAY.hemiI) * n;
  sun.color.copy(DAY.sun).lerp(NIGHT.sun, n); sun.intensity = DAY.sunI + (NIGHT.sunI - DAY.sunI) * n;
  fill.intensity = 14 - 6 * n;
  const pulse = 1 + 0.07 * Math.sin(t * 3.9);
  eye.scale.setScalar(pulse); eyeLight.intensity = (40 + 30 * n) * pulse;
  flames.forEach((f, i) => { const s = 1 + 0.25 * Math.sin(t * 17 + i * 2.1) + 0.1 * Math.sin(t * 29 + i); f.scale.set(1, s, 1); f.userData.light.intensity = 5 + 2 * s; });
  const hop = bump(m, 4.3, 0.3, 0.28) + bump(m, 8.0, 0.25, 0.2) + bump(m, 11.95, 0.25, 0.22) + bump(m, 19.65, 0.3, 0.35);
  sau.position.y = 0.02 * Math.sin(t * 6) + hop;
  sauArm.rotation.z = 1.2 * ease(clamp(ramp(m, 4.3, 4.5) - ramp(m, 5.6, 5.9), 0, 1));
  const shocked = (m >= 19.65 && m < 21.2) || m >= 34.0;
  eyesShock.visible = shocked; eyesAngry.visible = !shocked;
  // cape sways
  const cp = cape.geometry.attributes.position;
  for (let i = 0; i < cp.count; i++) {
    const b = i * 3, v = (0.725 - capeBase[b + 1]) / 1.45;
    cp.setXYZ(i, capeBase[b] + Math.sin(t * 1.7 + capeBase[b + 1] * 3) * 0.03 * v, capeBase[b + 1], capeBase[b + 2] - (0.04 + 0.03 * Math.sin(t * 2.3 + capeBase[b] * 4)) * v * v);
  }
  cp.needsUpdate = true;
  const ep = embGeo.attributes.position;
  for (let i = 0; i < EMB; i++) { const b = i * 4, y = (embBase[b + 1] + t * embBase[b + 3]) % 12; ep.setXYZ(i, embBase[b] + Math.sin(t * 0.8 + i) * 0.3, y, embBase[b + 2]); }
  ep.needsUpdate = true;
  renderer.render(scene, camera);
}

// ---------- overlays + captions on one paused GSAP timeline (rebuilt per voice) ----------
const capsEl = document.getElementById("caps");
let tl;
function buildTimeline() {
  if (tl) tl.kill();
  capsEl.textContent = "";
  gsap.set(["#hud", "#signwrap", "#signboard", "#signtitle", "#hud .pill", "#weaponred", "#hud2", "#shake"], { clearProps: "all" });
  tl = gsap.timeline({ paused: true });
  // sign drops on its chains, slams, the screen shakes, the title flares
  tl.fromTo("#signwrap", { y: -700 }, { y: 0, duration: 0.32, ease: "power4.in" }, 0);
  tl.fromTo("#signboard", { scaleY: 1 }, { scaleY: 0.9, transformOrigin: "50% 0%", duration: 0.07, yoyo: true, repeat: 1, ease: "power2.out" }, 0.32);
  tl.fromTo("#shake", { x: 0, y: 0 }, { keyframes: [{ x: -14, y: 10 }, { x: 12, y: -8 }, { x: -8, y: 6 }, { x: 5, y: -3 }, { x: 0, y: 0 }], duration: 0.35, ease: "none" }, 0.32);
  tl.fromTo("#signtitle", { filter: "drop-shadow(0 0 40px rgba(255,160,40,1)) drop-shadow(0 5px 0 #0a0708)" }, { filter: "drop-shadow(0 0 14px rgba(255,120,20,.85)) drop-shadow(0 5px 0 #0a0708)", duration: 0.8, ease: "power2.out" }, 0.32);
  tl.to("#signwrap", { rotation: 1.5, transformOrigin: "50% 0%", duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 2 }, 0.7);
  tl.to("#signwrap", { y: -900, duration: 0.4, ease: "power3.in" }, warp(3.0));
  tl.set("#hud", { visibility: "visible" }, warp(9.1));
  tl.fromTo("#hud .pill", { y: -120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(2)", stagger: 0.08 }, warp(9.1));
  tl.to("#weaponred", { opacity: 1, duration: 0.2 }, warp(16.6));
  tl.to("#hud2", { scale: 1.2, duration: 0.15, yoyo: true, repeat: 1 }, warp(16.6));
  V.caps.forEach(c => {
    const el = document.createElement("div"); el.className = "cap";
    const inner = document.createElement("div"); inner.className = "outline";
    c.w.forEach(([word, k], j) => { if (j) inner.append(" "); if (k) { const s = document.createElement("span"); s.className = k; s.textContent = word; inner.append(s); } else inner.append(word); });
    el.append(inner); capsEl.append(el);
    tl.set(el, { autoAlpha: 1 }, c.s);
    tl.fromTo(inner, { scale: 0.55, y: 30 }, { scale: 1, y: 0, duration: 0.14, ease: "back.out(2.6)" }, c.s);
    tl.set(el, { autoAlpha: 0 }, c.e);
  });
  tl.set({}, {}, DUR);
}

// ---------- layout ----------
const frame = document.getElementById("frame"), stagebox = document.getElementById("stagebox"), stage = document.getElementById("stage");
let t = 0;
function fit() {
  const r = frame.getBoundingClientRect(), s = Math.max(0.05, Math.min(r.width / 1080, r.height / 1920));
  stagebox.style.width = 1080 * s + "px"; stagebox.style.height = 1920 * s + "px"; stage.style.transform = "scale(" + s + ")";
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(1); renderer.setSize(Math.round(1080 * s * dpr), Math.round(1920 * s * dpr), false);
  renderAt(t);
}
new ResizeObserver(fit).observe(frame);

// ---------- player ----------
const audio = document.getElementById("audio"), btn = document.getElementById("play"), scrub = document.getElementById("scrub"), timeEl = document.getElementById("time"), note = document.getElementById("note");
const icoPlay = document.getElementById("icoPlay"), icoPause = document.getElementById("icoPause"), voicesEl = document.getElementById("voices");
let playing = false, useAudio = true, startT = 0, t0 = 0;
const fmt = x => Math.floor(x / 60) + ":" + (x % 60).toFixed(1).padStart(4, "0");
audio.addEventListener("error", () => { useAudio = false; note.textContent = "Ton nicht verfügbar: Die Vorschau läuft stumm."; });
function setT(x) {
  t = clamp(x, 0, DUR); renderAt(t); tl.seek(t, false); scrub.value = t;
  timeEl.textContent = fmt(t) + " / " + fmt(DUR).replace(/\.\d$/, "");
}
function setIcons() { icoPlay.hidden = playing; icoPause.hidden = !playing; btn.setAttribute("aria-label", playing ? "Pause" : "Abspielen"); }
async function play() {
  if (t >= DUR - 0.05) setT(0);
  playing = true; setIcons();
  if (useAudio) { try { audio.currentTime = t; await audio.play(); } catch (e) { useAudio = false; note.textContent = "Ton konnte nicht starten: Die Vorschau läuft stumm."; } }
  startT = t; t0 = performance.now(); requestAnimationFrame(loop);
}
function pause() { playing = false; audio.pause(); setIcons(); }
function loop(now) {
  if (!playing) return;
  const x = (useAudio && !audio.paused) ? audio.currentTime : startT + (now - t0) / 1000;
  if (x >= DUR) { setT(DUR); pause(); return; }
  setT(x); requestAnimationFrame(loop);
}
function selectVoice(id) {
  pause();
  V = VOICES.find(v => v.id === id) || VOICES[0]; DUR = V.dur;
  useAudio = true; note.textContent = "Stimme: " + V.name + " (" + V.desc + ")";
  audio.src = V.src; audio.load();
  scrub.max = DUR;
  [...voicesEl.children].forEach(b => b.setAttribute("aria-pressed", String(b.dataset.id === V.id)));
  try { localStorage.setItem("sauron-voice", V.id); } catch (e) {}
  buildTimeline(); setT(0);
}
VOICES.forEach(v => {
  const b = document.createElement("button"); b.type = "button"; b.className = "vbtn"; b.dataset.id = v.id;
  b.innerHTML = v.name.split(" ")[0] + "<small>" + v.desc + "</small>";
  b.addEventListener("click", () => selectVoice(v.id)); voicesEl.append(b);
});
btn.addEventListener("click", () => playing ? pause() : play());
scrub.addEventListener("input", () => { const x = parseFloat(scrub.value); if (useAudio) { try { audio.currentTime = x; } catch (e) {} } startT = x; t0 = performance.now(); setT(x); });
audio.addEventListener("ended", () => { if (playing) { setT(DUR); pause(); } });
document.addEventListener("keydown", e => { if (e.code === "Space" && e.target === document.body) { e.preventDefault(); playing ? pause() : play(); } });

let saved = null; try { saved = localStorage.getItem("sauron-voice"); } catch (e) {}
selectVoice(saved || VOICES[0].id);
fit();
window.__sceneReady = true;
window.__preview = { renderAt, setT, selectVoice };
</script>
